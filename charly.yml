# Makes this plugin repo a PROJECT so its own candy is actually gated.
#
# Without a root charly.yml the repo is "project-less": charly scans NO candies at all,
# so `charly box validate` at the repo root exits 0 on ANY manifest, including one with
# a malformed `plugin.providers` entry. The stock candy CI step asserted nothing.
# See opencharly/charly#459.
#
# Declaring discover: is the whole fix: the candy is scanned, the CUE schema gate
# applies, and the STOCK `charly box validate` step starts working with no workflow
# change. This file also declares the R10 witness bed (below).
discover:
    - path: candy
      recursive: true

check-migrate-app:
    local:
        description: |-
            Minimal kind:local template for the check-migrate-local bed — composes the
            command-only candy/plugin-migrate (no install content) so the bed exercises the
            externalized `charly migrate` engine host-side.
        candy:
            - plugin-migrate
check-migrate-local:
    local:
        from: check-migrate-app
        host: local
        disposable: true
        lifecycle: dev
        description: >-
            Sole proof of the externalized config-schema MIGRATION ENGINE (candy/plugin-migrate, command:migrate — M15). A disposable kind:local deploy on host: local runs `charly migrate` host-side against mktemp fixtures: the host charly resolves command:migrate from the compiled-in registry and Invoke(OpRun) runs the engine in-proc, proving the engine relocation (the universal strip-version-stamp step, idempotency, --dry-run plumbing) end-to-end on a fresh rebuild; the declarative transform ops are covered by the plugin's engine_test.go units. The last three steps prove the pipeline-lobster leg on the REAL eval-omarchy pipeline entities (testdata/eval-pr-plan.yml): stages→steps, kind:command→run:, skip_when→inverted when:, @stage.out→$stage.json.out, the added description:, the config:/args: consolidation — with @github candy refs and shell vars preserved byte-identical and a second run a no-op.
        plan:
            - check: charly migrate strips a retired top-level version stamp from a project AND its candy manifest (exit 0, "applied strip-version-stamp")
              id: migrate-strips-version-stamp
              exit_status: 0
              stderr:
                - contains: 'applied strip-version-stamp'
              context:
                - runtime
              command:
                command: 'd=$(mktemp -d); mkdir -p "$d/candy/x"; printf "discover:\n    - path: candy\n      recursive: true\n" > "$d/charly.yml"; printf "version: 2026.240.1943\nx:\n  candy:\n    description: d\n    plan:\n      - check: c\n        file: /x\n" > "$d/candy/x/charly.yml"; ${CHARLY_BIN} migrate --dir "$d" --project-only; rc=$?; grep -q "^version:" "$d/candy/x/charly.yml" && rc=1; rm -rf "$d"; exit $rc'
                in_container: false
            - check: migrate writes its rollback backups to the gitignored .charly/ tree, never adjacent (no *.bak in the project, .charly/.gitignore contains *)
              id: migrate-backup-gitignored
              exit_status: 0
              context:
                - runtime
              command:
                command: 'd=$(mktemp -d); printf "version: 2026.240.1943\ndiscover:\n    - path: candy\n      recursive: true\n" > "$d/charly.yml"; ${CHARLY_BIN} migrate --dir "$d" --project-only; rc=$?; find "$d" -name "*.bak*" | grep -q . && rc=1; test -d "$d/.charly/backups" || rc=1; grep -q "\\*" "$d/.charly/.gitignore" || rc=1; cd "$d" && git init -q && git add -A && git status --porcelain | grep -q "\.charly/" && rc=1; rm -rf "$d"; exit $rc'
                in_container: false
            - check: a versionless project is a no-op (exit 0, "nothing to migrate") — idempotency
              id: migrate-idempotent-noop
              exit_status: 0
              stderr:
                - contains: 'nothing to migrate'
              context:
                - runtime
              command:
                command: 'd=$(mktemp -d); printf "discover:\n    - path: candy\n      recursive: true\n" > "$d/charly.yml"; ${CHARLY_BIN} migrate --dir "$d" --project-only; rc=$?; rm -rf "$d"; exit $rc'
                in_container: false
            - check: charly migrate --dry-run reports the plan and touches nothing (exit 0, prints the dry-run trailer)
              id: migrate-dry-run
              exit_status: 0
              stderr:
                - contains: '(dry-run — no files were modified)'
              context:
                - runtime
              command:
                command: 'd=$(mktemp -d); printf "version: 2026.240.1943\n" > "$d/charly.yml"; ${CHARLY_BIN} migrate --dir "$d" --project-only --dry-run; rc=$?; grep -q "^version:" "$d/charly.yml" || rc=1; rm -rf "$d"; exit $rc'
                in_container: false
            - check: charly migrate rewrites the legacy kind-pipeline grammar into lobster steps syntax (stages→steps, kind-command→run, skip_when→inverted when, @stage.out→$stage.json.out), adds the required description, consolidates config, declares args pr, and leaves @github candy refs + shell vars byte-identical
              id: migrate-pipeline-v1
              exit_status: 0
              context:
                - runtime
              command:
                command: 'd=$(mktemp -d); cp candy/plugin-migrate/testdata/eval-pr-plan.yml "$d/charly.yml"; ${CHARLY_BIN} migrate --dir "$d" --project-only; rc=$?; f="$d/charly.yml"; grep -vE "^[[:space:]]*#" "$f" | grep -qE "stages:|skip_when|kind:|expect_exit|@oracle|@gate|[$]env[.]|[$]pr|[$]calver" && rc=1; grep -qF "description: Migrated pipeline check-omarchy-accept-matrix." "$f" || rc=1; grep -qF "description: Migrated pipeline check-omarchy-accept-suite." "$f" || rc=1; grep -qF "description: Migrated pipeline eval-pr-plan." "$f" || rc=1; grep -qE "^[[:space:]]+steps:$" "$f" || rc=1; grep -qE "^[[:space:]]+- agent:$" "$f" || rc=1; grep -qE "^[[:space:]]+run: " "$f" || rc=1; grep -qF "lanes: 16" "$f" || rc=1; grep -qF "escalate_after: 5" "$f" || rc=1; grep -qE "[!][(][$]oracle[.]json[.]class ==" "$f" || rc=1; grep -qF "\${pr}" "$f" || rc=1; grep -qF "\${calver}" "$f" || rc=1; grep -qF "\$report.json.tests" "$f" || rc=1; grep -qF "\$report.bed_template" "$f" || rc=1; grep -vE "^[[:space:]]*#" "$f" | grep -qF "\$latest" || rc=1; grep -vE "^[[:space:]]*#" "$f" | grep -qF "\$b" || rc=1; test "$(grep -cF "@github.com/opencharly/" "$f")" = "3" || rc=1; rm -rf "$d"; exit $rc'
                in_container: false
            - check: a SECOND charly migrate on the already-migrated pipeline is a no-op (exit 0, "nothing to migrate") — the pipeline-lobster step is idempotent
              id: migrate-pipeline-idempotent
              exit_status: 0
              stderr:
                - contains: 'nothing to migrate'
              context:
                - runtime
              command:
                command: 'd=$(mktemp -d); cp candy/plugin-migrate/testdata/eval-pr-plan.yml "$d/charly.yml"; ${CHARLY_BIN} migrate --dir "$d" --project-only >/dev/null 2>&1; ${CHARLY_BIN} migrate --dir "$d" --project-only; rc=$?; rm -rf "$d"; exit $rc'
                in_container: false
            - check: charly migrate --dry-run reports the pipeline plan and leaves the legacy stages grammar untouched (exit 0, dry-run trailer, stages/skip_when still present)
              id: migrate-pipeline-dry-run
              exit_status: 0
              stderr:
                - contains: '(dry-run — no files were modified)'
              context:
                - runtime
              command:
                command: 'd=$(mktemp -d); cp candy/plugin-migrate/testdata/eval-pr-plan.yml "$d/charly.yml"; ${CHARLY_BIN} migrate --dir "$d" --project-only --dry-run; rc=$?; grep -q "stages:" "$d/charly.yml" || rc=1; grep -q "skip_when" "$d/charly.yml" || rc=1; grep -q "kind: command" "$d/charly.yml" || rc=1; rm -rf "$d"; exit $rc'
                in_container: false
