# Makes this plugin repo a PROJECT so its own candy is actually gated.
#
# Without a root charly.yml the repo is "project-less": charly scans NO candies at all,
# so `charly box validate` at the repo root exits 0 on ANY manifest, including one with
# a malformed `plugin.providers` entry. The stock candy CI step asserted nothing.
# See opencharly/charly#459.
#
# Declaring discover: is the whole fix: the candy is scanned, the CUE schema gate
# applies, and the STOCK `charly box validate` step starts working with no workflow
# change. This file also declares the R10 witness bed (below).
discover:
    - path: candy
      recursive: true

check-migrate-app:
    local:
        description: |-
            Minimal kind:local template for the check-migrate-local bed — composes the
            command-only candy/plugin-migrate (no install content) so the bed exercises the
            externalized `charly migrate` engine host-side.
        candy:
            - plugin-migrate
check-migrate-local:
    local:
        from: check-migrate-app
        host: local
        disposable: true
        lifecycle: dev
        description: >-
            Sole proof of the externalized config-schema MIGRATION ENGINE (candy/plugin-migrate, command:migrate — M15). A disposable kind:local deploy on host: local runs `charly migrate` host-side against mktemp fixtures: the host charly resolves command:migrate from the compiled-in registry and Invoke(OpRun) runs the engine in-proc, proving the engine relocation (the universal strip-version-stamp step, idempotency, --dry-run plumbing) end-to-end on a fresh rebuild; the declarative transform ops are covered by the plugin's engine_test.go units. The last three steps prove the pipeline-lobster leg on the REAL eval-omarchy pipeline entities (testdata/eval-pr-plan.yml): stages→steps, kind:command→run:, skip_when→inverted when:, @stage.out→$stage.json.out, the added description:, the config:/args: consolidation — with @github candy refs and shell vars preserved byte-identical and a second run a no-op.
        plan:
            - check: charly migrate strips a retired top-level version stamp from a project AND its candy manifest (exit 0, "applied strip-version-stamp")
              id: migrate-strips-version-stamp
              exit_status: 0
              stderr:
                - contains: 'applied strip-version-stamp'
              context:
                - runtime
              command:
                command: 'd=$(mktemp -d); mkdir -p "$d/candy/x"; printf "discover:\n    - path: candy\n      recursive: true\n" > "$d/charly.yml"; printf "version: 2026.240.1943\nx:\n  candy:\n    description: d\n    plan:\n      - check: c\n        file: /x\n" > "$d/candy/x/charly.yml"; ${CHARLY_BIN} migrate --dir "$d" --project-only; rc=$?; grep -q "^version:" "$d/candy/x/charly.yml" && rc=1; rm -rf "$d"; exit $rc'
                in_container: false
            - check: migrate writes its rollback backups to the gitignored .charly/ tree, never adjacent (no *.bak in the project, .charly/.gitignore contains *)
              id: migrate-backup-gitignored
              exit_status: 0
              context:
                - runtime
              command:
                command: 'd=$(mktemp -d); printf "version: 2026.240.1943\ndiscover:\n    - path: candy\n      recursive: true\n" > "$d/charly.yml"; ${CHARLY_BIN} migrate --dir "$d" --project-only; rc=$?; find "$d" -name "*.bak*" | grep -q . && rc=1; test -d "$d/.charly/backups" || rc=1; grep -q "\\*" "$d/.charly/.gitignore" || rc=1; cd "$d" && git init -q && git add -A && git status --porcelain | grep -q "\.charly/" && rc=1; rm -rf "$d"; exit $rc'
                in_container: false
            - check: a versionless project is a no-op (exit 0, "nothing to migrate") — idempotency
              id: migrate-idempotent-noop
              exit_status: 0
              stderr:
                - contains: 'nothing to migrate'
              context:
                - runtime
              command:
                command: 'd=$(mktemp -d); printf "discover:\n    - path: candy\n      recursive: true\n" > "$d/charly.yml"; ${CHARLY_BIN} migrate --dir "$d" --project-only; rc=$?; rm -rf "$d"; exit $rc'
                in_container: false
            - check: charly migrate --dry-run reports the plan and touches nothing (exit 0, prints the dry-run trailer)
              id: migrate-dry-run
              exit_status: 0
              stderr:
                - contains: '(dry-run — no files were modified)'
              context:
                - runtime
              command:
                command: 'd=$(mktemp -d); printf "version: 2026.240.1943\n" > "$d/charly.yml"; ${CHARLY_BIN} migrate --dir "$d" --project-only --dry-run; rc=$?; grep -q "^version:" "$d/charly.yml" || rc=1; rm -rf "$d"; exit $rc'
                in_container: false
            - check: charly migrate RETIRES a barren `group:` node (a group with nothing to promote) so a config that could not load now loads — the per-host overlay that made every VM bed on the host unbootable when it carried one (charly#827), proven by the node being gone AND the fixture validating afterwards
              id: migrate-retires-barren-group-node
              exit_status: 0
              stderr:
                - contains: 'applied retire-empty-group-node'
              context:
                - runtime
              command:
                command: 'd=$(mktemp -d); printf "discover:\n    - path: candy\n      recursive: true\n" > "$d/charly.yml"; printf "leftover:\n    group: {}\n" >> "$d/charly.yml"; ${CHARLY_BIN} migrate --dir "$d" --project-only; rc=$?; grep -q "group:" "$d/charly.yml" && rc=1; ${CHARLY_BIN} box validate --dir "$d" >/dev/null 2>&1 || rc=1; rm -rf "$d"; exit $rc'
                in_container: false
            - check: a SECOND charly migrate on the already-retired document is a no-op (exit 0, "nothing to migrate") — the retire step is idempotent
              id: migrate-retire-barren-group-idempotent
              exit_status: 0
              stderr:
                - contains: 'nothing to migrate'
              context:
                - runtime
              command:
                command: 'd=$(mktemp -d); printf "discover:\n    - path: candy\n      recursive: true\n" > "$d/charly.yml"; printf "leftover:\n    group: {}\n" >> "$d/charly.yml"; ${CHARLY_BIN} migrate --dir "$d" --project-only >/dev/null 2>&1; ${CHARLY_BIN} migrate --dir "$d" --project-only; rc=$?; rm -rf "$d"; exit $rc'
                in_container: false
            - check: charly migrate rewrites the legacy kind-pipeline grammar into lobster steps syntax (stages→steps, kind-command→run, skip_when→inverted when, @stage.out→$stage.json.out), adds the required description, consolidates config, labels every lifted verb step with the `run:` intent keyword it emits (a bare `<verb>:` as a step key is the load failure this once shipped) plus the stage id as its label, declares a #TaskParamSpec-valid args pr entry, duplicates into each lifted verb body the entity-level knobs that verb reads (skills/llm/repo, media, report) so the lifted verb is self-contained on a plan with no pipeline config, carries a retired `concurrency: {lanes: N}` onto the pooled fan-out arm (one `lanes: ${prs}` step with `batch_size: N`, `item_var: pr`, the whole migrated step list as its body, and every retired `$pr` read rebound to `$pr.stdout`) for a stage graph the target grammar can express, keeps that knob in `config:` for one it cannot (the matrix wraps, eval-pr-plan does not — its stages chain, opencharly/sdk#441), and leaves @github candy refs + shell vars byte-identical
              id: migrate-pipeline-v1
              exit_status: 0
              context:
                - runtime
              command:
                command: 'd=$(mktemp -d); cp candy/plugin-migrate/testdata/eval-pr-plan.yml "$d/charly.yml"; ${CHARLY_BIN} migrate --dir "$d" --project-only; rc=$?; f="$d/charly.yml"; grep -vE "^[[:space:]]*#" "$f" | grep -qE "stages:|skip_when|kind:|expect_exit|@oracle|@gate|[$]env[.]|[$]calver([^A-Za-z0-9_.-]|$)|[$]pr([^A-Za-z0-9_.-]|$)" && rc=1; grep -qF "description: Migrated pipeline check-omarchy-accept-matrix." "$f" || rc=1; grep -qF "description: Migrated pipeline check-omarchy-accept-suite." "$f" || rc=1; grep -qF "description: Migrated pipeline eval-pr-plan." "$f" || rc=1; grep -qE "^[[:space:]]+steps:$" "$f" || rc=1; grep -qE "^[[:space:]]+- run: oracle$" "$f" || rc=1; test "$(grep -cE "^[[:space:]]+- run: " "$f")" = "12" || rc=1; grep -vE "^[[:space:]]*#" "$f" | grep -qE "^[[:space:]]+- (agent|probe|ade|generate|emit|media|gate):" && rc=1; grep -qF "the pr value this run is invoked with (--args-json)" "$f" || rc=1; grep -qF "bound per lane by --prs" "$f" && rc=1; grep -qE "^[[:space:]]+run: " "$f" || rc=1; grep -qF "lanes: 16" "$f" || rc=1; grep -qF "batch_size: 16" "$f" || rc=1; grep -qF "lanes: \${prs}" "$f" || rc=1; grep -qF "item_var: pr" "$f" || rc=1; grep -qF "\$pr.stdout" "$f" || rc=1; grep -cF "the pr values this fan-out run is invoked with" "$f" | grep -qx 1 || rc=1; grep -qF "escalate_after: 5" "$f" || rc=1; grep -qE "[!][(][$]oracle[.]json[.]class ==" "$f" || rc=1; grep -qF "\${pr}" "$f" || rc=1; grep -qF "\${calver}" "$f" || rc=1; grep -qF "\$report.json.tests" "$f" || rc=1; grep -qF "\$report.bed_template" "$f" || rc=1; grep -vE "^[[:space:]]*#" "$f" | grep -qF "\$latest" || rc=1; grep -vE "^[[:space:]]*#" "$f" | grep -qF "\$b" || rc=1; test "$(grep -oE "@github\.com/[^ ]+" "$f" | sort -u | wc -l)" = "3" || rc=1; grep -qF "\$github" "$f" && rc=1; test "$(grep -cE "^[[:space:]]*skills:$" "$f")" = "5" || rc=1; test "$(grep -cE "^[[:space:]]*report:$" "$f")" = "4" || rc=1; test "$(grep -cF "repo: omacom/omarchy" "$f")" -ge "5" || rc=1; test "$(grep -cE "^[[:space:]]*media:$" "$f")" -ge "2" || rc=1; rm -rf "$d"; exit $rc'
                in_container: false
            - check: a SECOND charly migrate on the already-migrated pipeline is a no-op (exit 0, "nothing to migrate") — the pipeline-lobster step is idempotent
              id: migrate-pipeline-idempotent
              exit_status: 0
              stderr:
                - contains: 'nothing to migrate'
              context:
                - runtime
              command:
                command: 'd=$(mktemp -d); cp candy/plugin-migrate/testdata/eval-pr-plan.yml "$d/charly.yml"; ${CHARLY_BIN} migrate --dir "$d" --project-only >/dev/null 2>&1; ${CHARLY_BIN} migrate --dir "$d" --project-only; rc=$?; rm -rf "$d"; exit $rc'
                in_container: false
            - check: 'the emitted fan-out arm LOADS — the migrated check-omarchy-accept-matrix (a retired `concurrency: {lanes: 16}` over two REF-INDEPENDENT stages) becomes ONE `lanes: ${prs}` step with `batch_size: 16`, `item_var: pr` and the whole stage list as its body, the retired key is gone, and `charly box validate` reports 0 warnings / 0 errors'
              id: migrate-pipeline-lanes-loadgate-new
              exit_status: 0
              context:
                - runtime
              command:
                command: |-
                  set -eu
                  d=$(mktemp -d)
                  mkdir -p "$d/candy/pipe"
                  { printf 'discover:\n    - path: candy\n      recursive: true\n'; cat candy/plugin-migrate/testdata/lanes-matrix.yml; } > "$d/charly.yml"
                  printf 'pipe:\n  candy:\n    description: the pipeline front-end, by released ref\n    candy:\n      - "@github.com/opencharly/plugin-pipeline/candy/plugin-pipeline:v2026.294.1135"\n    plan:\n      - check: the front-end resolves\n        context: [build]\n        command: "true"\n' > "$d/candy/pipe/charly.yml"
                  ${CHARLY_BIN} migrate --dir "$d" --project-only >/dev/null 2>&1
                  grep -qF 'lanes: ${prs}' "$d/charly.yml" || { echo "the fan-out arm was not emitted" >&2; exit 1; }
                  grep -qF 'batch_size: 16' "$d/charly.yml" || { echo "the pool width was not emitted" >&2; exit 1; }
                  grep -qF 'item_var: pr' "$d/charly.yml" || { echo "the lane binding was not emitted" >&2; exit 1; }
                  if grep -qE '^[[:space:]]*concurrency:' "$d/charly.yml"; then echo "the retired concurrency: key survived" >&2; exit 1; fi
                  rc=0
                  ${CHARLY_BIN} box validate --dir "$d" > "$d/out" 2>&1 || rc=1
                  grep -q '0 errors' "$d/out" || rc=1
                  grep -q '0 warnings' "$d/out" || rc=1
                  [ "$rc" -eq 0 ] || cat "$d/out" >&2
                  rm -rf "$d"
                  exit $rc
                in_container: false
            - check: 'the load-gate NEGATIVE CONTROL — the SAME entity authored in the RETIRED grammar (the un-migrated fixture) must FAIL the same validate, naming `concurrency: field not allowed`; a control that passes would mean the gate measures nothing'
              id: migrate-pipeline-lanes-loadgate-old
              exit_status: 0
              context:
                - runtime
              command:
                command: |-
                  set -eu
                  d=$(mktemp -d)
                  mkdir -p "$d/candy/pipe"
                  { printf 'discover:\n    - path: candy\n      recursive: true\n'; cat candy/plugin-migrate/testdata/lanes-matrix.yml; } > "$d/charly.yml"
                  printf 'pipe:\n  candy:\n    description: the pipeline front-end, by released ref\n    candy:\n      - "@github.com/opencharly/plugin-pipeline/candy/plugin-pipeline:v2026.294.1135"\n    plan:\n      - check: the front-end resolves\n        context: [build]\n        command: "true"\n' > "$d/candy/pipe/charly.yml"
                  rc=0
                  ${CHARLY_BIN} box validate --dir "$d" > "$d/out" 2>&1 || rc=$?
                  # Every BAD path exits NON-ZERO here. An earlier version folded its own
                  # verdict into $rc and then asserted [ "$rc" -ne 0 ], which is true on every
                  # path — a control that could never fail (plugin-migrate#24 round 1).
                  if [ "$rc" -eq 0 ]; then
                    echo "the RETIRED concurrency: shape VALIDATED — the gate measures nothing" >&2
                    cat "$d/out" >&2
                    rm -rf "$d"
                    exit 1
                  fi
                  if ! grep -q 'concurrency: field not allowed' "$d/out"; then
                    echo "the control failed for the wrong reason" >&2
                    cat "$d/out" >&2
                    rm -rf "$d"
                    exit 1
                  fi
                  rm -rf "$d"
                  exit 0
                in_container: false
            - check: charly migrate --dry-run reports the pipeline plan and leaves the legacy stages grammar untouched (exit 0, dry-run trailer, stages/skip_when still present)
              id: migrate-pipeline-dry-run
              exit_status: 0
              stderr:
                - contains: '(dry-run — no files were modified)'
              context:
                - runtime
              command:
                command: 'd=$(mktemp -d); cp candy/plugin-migrate/testdata/eval-pr-plan.yml "$d/charly.yml"; ${CHARLY_BIN} migrate --dir "$d" --project-only --dry-run; rc=$?; grep -q "stages:" "$d/charly.yml" || rc=1; grep -q "skip_when" "$d/charly.yml" || rc=1; grep -q "kind: command" "$d/charly.yml" || rc=1; rm -rf "$d"; exit $rc'
                in_container: false
